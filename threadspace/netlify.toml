[build]
  command = "npm install --include=dev && npm run build"
  publish = "dist"

# Single-page app: every path is served by index.html so refreshes and direct links on nested routes work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
